<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bigas Voice</title>
<style>
  :root{
    --fundo:#0c0d10; --sup:#171a21; --sup2:#1d212a; --sup3:#252a35;
    --linha:#2a2f3a; --linha2:#353b48; --txt:#eef1f6; --txt2:#a2aab8; --txt3:#6d7583;
    --azul:#0891b2; --azul2:#22d3ee; --verde:#3fd07a; --vermelho:#f2564a; --amarelo:#f0b429;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fundo); color:var(--txt);
    font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; overflow:hidden;
  }
  button{ border:0; border-radius:9px; cursor:pointer; font:inherit; font-weight:600 }
  button:disabled{ opacity:.55; cursor:default }
  input{
    background:#0c0d10; border:1px solid var(--linha2); border-radius:9px;
    color:var(--txt); padding:11px 12px; font:inherit; width:100%;
  }
  input:focus{ outline:none; border-color:var(--azul) }
  .b-azul{ background:var(--azul); color:#fff; padding:11px }
  .b-azul:hover:not(:disabled){ background:var(--azul2); color:#0c0d10 }
  .b-cinza{ background:var(--sup2); color:var(--txt2); padding:11px }
  .b-cinza:hover:not(:disabled){ color:var(--txt) }
  .b-verde{ background:var(--verde); color:#0c0d10; padding:9px 14px }
  .b-verde:hover:not(:disabled){ background:#59d98d }
  .erro{ color:var(--vermelho); font-size:12.5px; min-height:16px }

  /* ---------- tela de login (antes de qualquer outra coisa) ---------- */
  #tela-login{
    flex:1; display:flex; align-items:center; justify-content:center;
  }
  #caixa-login{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; padding:24px }
  .marca-login{ display:flex; align-items:center; gap:12px; margin-bottom:6px }
  .marca-login .logo{
    width:44px; height:44px; border-radius:13px; flex-shrink:0;
    background:linear-gradient(145deg,var(--azul),#0e7490);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .marca-login h1{ font-size:19px; margin:0 }
  .marca-login p{ font-size:12px; color:var(--txt3); margin:2px 0 0 }
  label{ display:block; font-size:12px; color:var(--txt2); margin-bottom:5px }
  .botoes-login{ display:flex; gap:9px }
  .botoes-login button{ flex:1 }

  /* ---------- casa (logado): trilho + amigos + painel ---------- */
  #tela-casa{ display:none; flex:1; min-width:0 }
  .trilho{
    width:64px; flex-shrink:0; background:var(--sup); border-right:1px solid var(--linha);
    display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 0;
  }
  .trilho .icone{
    width:44px; height:44px; border-radius:14px; background:var(--sup2);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    color:var(--txt2); position:relative;
  }
  .trilho .icone.ativo{ background:var(--azul); color:#fff; border-radius:16px }

  .coluna-amigos{
    width:260px; flex-shrink:0; background:var(--sup2); border-right:1px solid var(--linha);
    display:flex; flex-direction:column; min-height:0;
  }
  .coluna-amigos .cabecalho{
    padding:16px 14px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  .coluna-amigos .cabecalho b{ font-size:14px }
  .sair{ background:none; color:var(--txt3); font-size:11.5px; text-decoration:underline; padding:0 }
  .add-amigo{ padding:0 14px 12px; display:flex; gap:6px }
  .add-amigo input{ font-size:12.5px; padding:9px 10px }
  .add-amigo button{ padding:9px 12px; font-size:12.5px; white-space:nowrap }
  .erro-add{ padding:0 14px 8px; margin:0 }

  h2{ font-size:11px; margin:0; padding:6px 14px; color:var(--txt3); text-transform:uppercase; letter-spacing:.05em }
  .lista-amigos{ flex:1; overflow-y:auto; padding:0 8px 12px; display:flex; flex-direction:column; gap:3px }
  .amigo{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:8px; cursor:default;
  }
  .amigo:hover{ background:var(--sup3) }
  .amigo .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--sup3); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--txt2);
  }
  .amigo .nome{ flex:1; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .amigo .chamar{ opacity:0; transition:opacity .12s }
  .amigo:hover .chamar{ opacity:1 }
  .vazio{ color:var(--txt3); font-size:12.5px; text-align:center; padding:18px 14px }

  /* ---------- painel principal (sem call ativa daqui) ---------- */
  .painel{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-width:0 }
  .painel .logo-grande{
    width:72px; height:72px; border-radius:22px; color:#fff; font-size:30px;
    background:linear-gradient(145deg,var(--azul),#0e7490);
    display:flex; align-items:center; justify-content:center; margin-bottom:6px;
  }
  .painel h2{ padding:0; text-transform:none; letter-spacing:0; font-size:16px; color:var(--txt) }
  .painel p{ color:var(--txt3); font-size:13px; max-width:280px; text-align:center }

  /* convite chegando: aviso no topo da coluna de amigos */
  .convite-chegando{
    display:none; margin:0 10px 10px; padding:10px 12px; border-radius:10px;
    background:var(--sup3); border:1px solid var(--azul);
    flex-direction:column; gap:8px;
  }
  .convite-chegando.tem{ display:flex }
  .convite-chegando b{ font-size:13px }
  .convite-chegando .linha{ display:flex; align-items:center; justify-content:space-between; gap:8px }
</style>
</head>
<body>

  <div id="tela-login">
    <div id="caixa-login">
      <div class="marca-login">
        <div class="logo">
          <svg viewBox="0 0 512 512" width="26" height="26" aria-hidden="true">
            <path d="M103 154 V104 H153" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M409 358 V408 H359" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="163" y="220" width="54" height="128" rx="18" fill="currentColor"/>
            <rect x="229" y="164" width="54" height="184" rx="18" fill="currentColor"/>
            <rect x="295" y="196" width="54" height="152" rx="18" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Bigas Voice</h1>
          <p>voz e tela direto entre vocês</p>
        </div>
      </div>
      <div>
        <label for="nick">Seu nick</label>
        <input id="nick" type="text" maxlength="20" placeholder="ex: BigHouse" autocomplete="off">
      </div>
      <div>
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="mínimo 6 caracteres">
      </div>
      <p class="erro" id="erro-login"></p>
      <div class="botoes-login">
        <button id="btn-entrar" class="b-azul" type="button">Entrar</button>
        <button id="btn-criar" class="b-cinza" type="button">Criar conta</button>
      </div>
    </div>
  </div>

  <div id="tela-casa">
    <div class="trilho">
      <div class="icone ativo" title="Amigos">🏠</div>
    </div>
    <div class="coluna-amigos">
      <div class="cabecalho">
        <b id="meu-nick"></b>
        <button class="sair" id="btn-sair" type="button">sair</button>
      </div>

      <div class="convite-chegando" id="convite-chegando">
        <b id="convite-texto"></b>
        <div class="linha">
          <button class="b-verde" id="btn-aceitar-convite" type="button" style="flex:1">Entrar na chamada</button>
        </div>
      </div>

      <div class="add-amigo">
        <input id="add-nick" type="text" maxlength="20" placeholder="nick do amigo" autocomplete="off">
        <button id="btn-add" class="b-azul" type="button">+</button>
      </div>
      <p class="erro erro-add" id="erro-add"></p>

      <h2>Amigos</h2>
      <div class="lista-amigos" id="lista-amigos"><p class="vazio">Nenhum amigo salvo ainda. Adiciona pelo nick aí em cima.</p></div>
    </div>

    <div class="painel">
      <div class="logo-grande">
        <svg viewBox="0 0 512 512" width="34" height="34" aria-hidden="true">
          <path d="M103 154 V104 H153" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M409 358 V408 H359" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="163" y="220" width="54" height="128" rx="18" fill="currentColor"/>
          <rect x="229" y="164" width="54" height="184" rx="18" fill="currentColor"/>
          <rect x="295" y="196" width="54" height="152" rx="18" fill="currentColor"/>
        </svg>
      </div>
      <h2>Escolha um amigo pra chamar</h2>
      <p>Passa o mouse num amigo na lista e clica em "Chamar" — ele recebe na hora, sem link, sem código.</p>
    </div>
  </div>

  <script type="module" src="home.js"></script>
</body>
</html>
