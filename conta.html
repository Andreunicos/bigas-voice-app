<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conta e amigos — Bigas Voice</title>
<style>
  :root{
    --fundo:#121419; --sup:#171a21; --sup2:#1d212a; --sup3:#252a35;
    --linha:#2a2f3a; --linha2:#353b48; --txt:#eef1f6; --txt2:#a2aab8; --txt3:#6d7583;
    --azul:#0891b2; --azul2:#22d3ee; --verde:#3fd07a; --vermelho:#f2564a; --amarelo:#f0b429;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fundo); color:var(--txt);
    font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
    padding:22px; height:100vh; display:flex; flex-direction:column; gap:14px;
    overflow-y:auto;
  }
  h1{font-size:16px; margin:0; font-weight:700}
  h2{font-size:12px; margin:0; color:var(--txt3); text-transform:uppercase; letter-spacing:.04em}
  p{margin:0; color:var(--txt2); font-size:13px}
  input{
    background:#0c0d10; border:1px solid var(--linha2); border-radius:9px;
    color:var(--txt); padding:11px 12px; font:inherit; width:100%;
  }
  input:focus{outline:none; border-color:var(--azul)}
  label{display:block; font-size:12px; color:var(--txt2); margin-bottom:5px}
  .campo{margin-bottom:11px}
  .erro{color:var(--vermelho); font-size:12.5px; min-height:16px}
  button{
    border:0; border-radius:9px; padding:11px; cursor:pointer;
    font:inherit; font-weight:600;
  }
  button:disabled{ opacity:.55; cursor:default }
  .b-azul{background:var(--azul); color:#fff}
  .b-azul:hover:not(:disabled){background:var(--azul2); color:#0c0d10}
  .b-cinza{background:var(--sup2); color:var(--txt2)}
  .b-cinza:hover:not(:disabled){color:var(--txt)}
  .b-verde{background:var(--verde); color:#0c0d10}
  .b-verde:hover:not(:disabled){background:#59d98d}

  #tela-login{display:flex; flex-direction:column; gap:12px; max-width:340px; margin:auto}
  #tela-login .trocar{background:none; text-decoration:underline; color:var(--txt2); font-size:12.5px; padding:4px}
  #tela-login .botoes{display:flex; gap:9px}
  #tela-login .botoes button{flex:1}

  #tela-conta{display:none; flex-direction:column; gap:16px; flex:1; min-height:0}
  .cabecalho{display:flex; align-items:center; justify-content:space-between}
  .cabecalho b{font-size:15px}
  .sair{background:none; color:var(--txt3); font-size:12px; text-decoration:underline}

  .add-amigo{display:flex; gap:8px}
  .add-amigo input{flex:1}
  .add-amigo button{white-space:nowrap}

  .lista{display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; min-height:60px}
  .amigo, .convite{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--sup); border:1px solid var(--linha); border-radius:10px; padding:10px 12px;
  }
  .amigo b, .convite b{font-size:13.5px}
  .vazio{color:var(--txt3); font-size:12.5px; text-align:center; padding:16px 0}

  .convites{background:var(--sup2); border:1px solid var(--azul); border-radius:10px; padding:10px 12px; display:none}
  .convites.tem{display:flex; flex-direction:column; gap:8px}
  .convite{background:var(--sup3); border-color:var(--linha2)}
</style>
</head>
<body>

  <div id="tela-login">
    <h1>Entrar no Bigas Voice</h1>
    <p>Seu nick e sua lista de amigos ficam salvos — não precisa recriar sala toda vez.</p>
    <div class="campo">
      <label for="nick">Seu nick</label>
      <input id="nick" type="text" maxlength="20" placeholder="ex: BigHouse" autocomplete="off">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="mínimo 6 caracteres">
    </div>
    <p class="erro" id="erro-login"></p>
    <div class="botoes">
      <button id="btn-entrar" class="b-azul" type="button">Entrar</button>
      <button id="btn-criar" class="b-cinza" type="button">Criar conta</button>
    </div>
  </div>

  <div id="tela-conta">
    <div class="cabecalho">
      <b>Olá, <span id="meu-nick"></span></b>
      <button class="sair" id="btn-sair" type="button">sair</button>
    </div>

    <div class="convites" id="caixa-convites">
      <h2>Chamadas pra você</h2>
      <div id="lista-convites"></div>
    </div>

    <div>
      <h2 style="margin-bottom:8px">Adicionar amigo</h2>
      <div class="add-amigo">
        <input id="add-nick" type="text" maxlength="20" placeholder="nick do seu amigo" autocomplete="off">
        <button id="btn-add" class="b-azul" type="button">Adicionar</button>
      </div>
      <p class="erro" id="erro-add"></p>
    </div>

    <div style="display:flex; flex-direction:column; flex:1; min-height:0">
      <h2 style="margin-bottom:8px">Seus amigos</h2>
      <div class="lista" id="lista-amigos"><p class="vazio">Nenhum amigo salvo ainda.</p></div>
    </div>
  </div>

  <script type="module" src="conta.js"></script>
</body>
</html>
