<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escolha o que compartilhar</title>
<style>
  :root{
    --fundo:#121419; --sup:#171a21; --sup2:#1d212a; --linha:#2a2f3a;
    --txt:#eef1f6; --txt2:#a2aab8; --azul:#0891b2; --azul2:#22d3ee;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fundo); color:var(--txt);
    font:14px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;
    padding:18px; height:100vh; display:flex; flex-direction:column;
  }
  h1{font-size:15px; margin:0 0 14px; font-weight:600; color:var(--txt2)}
  .grade{
    flex:1; overflow-y:auto; display:grid;
    grid-template-columns:repeat(3,1fr); gap:12px; align-content:start;
  }
  .item{
    background:var(--sup); border:2px solid var(--linha); border-radius:10px;
    padding:8px; cursor:pointer; text-align:left; color:var(--txt);
    font:inherit; display:flex; flex-direction:column; gap:6px;
  }
  .item:hover, .item:focus{ border-color:var(--azul); outline:none }
  .item img{
    width:100%; height:100px; object-fit:contain; background:#000;
    border-radius:6px;
  }
  .item span{
    font-size:12px; color:var(--txt2); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .vazio{color:var(--txt2); padding:30px; text-align:center}
</style>
</head>
<body>
  <h1>Escolha a tela ou janela que você quer compartilhar</h1>
  <div class="grade" id="grade">
    <p class="vazio">Carregando...</p>
  </div>
  <script src="seletor-de-tela.js"></script>
</body>
</html>
