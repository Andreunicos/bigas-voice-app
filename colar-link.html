<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar com um link</title>
<style>
  :root{
    --fundo:#121419; --sup:#171a21; --linha:#2a2f3a; --linha2:#353b48;
    --txt:#eef1f6; --txt2:#a2aab8; --azul:#0891b2; --azul2:#22d3ee;
    --vermelho:#f2564a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fundo); color:var(--txt);
    font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
    padding:22px; height:100vh; display:flex; flex-direction:column; gap:12px;
  }
  h1{font-size:15px; margin:0; font-weight:600}
  p{margin:0; color:var(--txt2); font-size:13px}
  input{
    background:#0c0d10; border:1px solid var(--linha2); border-radius:9px;
    color:var(--txt); padding:11px 12px; font:inherit;
  }
  input:focus{outline:none; border-color:var(--azul)}
  .erro{color:var(--vermelho); font-size:12.5px; min-height:16px}
  .botoes{display:flex; gap:9px; margin-top:auto}
  button{
    flex:1; border:0; border-radius:9px; padding:11px; cursor:pointer;
    font:inherit; font-weight:600;
  }
  #entrar{background:var(--azul); color:#fff}
  #entrar:hover{background:var(--azul2); color:#0c0d10}
  #cancelar{background:var(--sup); color:var(--txt2)}
  #cancelar:hover{color:var(--txt)}
</style>
</head>
<body>
  <h1>Cole aqui o link que seu amigo mandou</h1>
  <p>É o mesmo link de sempre — o do WhatsApp, o de "Copiar".</p>
  <input id="link" type="text" placeholder="https://andreunicos.github.io/#..." autofocus>
  <p class="erro" id="erro"></p>
  <div class="botoes">
    <button id="cancelar" type="button">Cancelar</button>
    <button id="entrar" type="button">Entrar</button>
  </div>
  <script src="colar-link.js"></script>
</body>
</html>
